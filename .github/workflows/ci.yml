name: CI

on:
  push:
    branches: [ main, 'REL*' ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP lint
        run: |
          set -e
          if [ -f Chroma.skin.php ]; then php -l Chroma.skin.php; fi
          if [ -d includes ]; then
            find includes -name '*.php' -print0 | xargs -0 -r -n1 php -l
          fi

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = ['skin.json', 'composer.json', 'package.json'] + glob.glob('i18n/*.json')
          ok = True
          for f in files:
              try:
                  json.load(open(f, encoding='utf-8'))
                  print('ok', f)
              except Exception as e:
                  ok = False
                  print('FAIL', f, e)
          sys.exit(0 if ok else 1)
          PY

      - name: Check required files
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s resources/styles/tokens.css
          test -s resources/styles/base.css
          test -s resources/scripts/chroma.js
          test -s demo/index.html

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Demo accessibility audit
        run: |
          python3 -m http.server 8080 --directory . &
          SERVER_PID=$!
          sleep 2
          node tests/a11y-demo.mjs
          kill "$SERVER_PID"
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot
          path: screenshots/ci-demo.png
          if-no-files-found: ignore

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regenerate tokens and check drift
        run: |
          npm run tokens
          npm run presets
          git diff --exit-code -- resources/styles/tokens.css resources/styles/tokens-presets.css docs/tokens.json
