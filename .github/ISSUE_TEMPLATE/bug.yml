name: Bug report
description: Report a rendering, layout or behaviour bug in Chroma.
labels: [bug]
body:
  - type: input
    id: mw
    attributes:
      label: MediaWiki version
      placeholder: "1.43.5"
    validations:
      required: true
  - type: input
    id: chroma
    attributes:
      label: Chroma version / branch
      placeholder: "0.1.0 / REL1_46"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if possible.
  - type: textarea
    id: console
    attributes:
      label: Browser console / PHP error output
      render: text
