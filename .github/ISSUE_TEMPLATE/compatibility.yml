name: Compatibility report
description: Report how a specific extension or gadget behaves with Chroma.
labels: [compatibility]
body:
  - type: input
    id: mw
    attributes:
      label: MediaWiki version
    validations:
      required: true
  - type: input
    id: skin
    attributes:
      label: Chroma version / branch
    validations:
      required: true
  - type: input
    id: ext
    attributes:
      label: Extension name and version
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Compatibility level observed
      options:
        - A — works, looks unthemed
        - B — works and themed
        - Broken — functional problem
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / screenshots
